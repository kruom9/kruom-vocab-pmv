<style>#app{max-width:1100px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 5px;border-bottom:1px solid #ffffff22;text-align:left;vertical-align:top}th{color:var(--gold);position:sticky;top:0;background:var(--card)}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp .card{margin:0}.kp b{font:700 26px Fredoka;color:var(--or)}.no{color:var(--bad)}.yes{color:var(--lime)}select,input[type=date]{padding:10px;border-radius:12px;background:#1b1030;color:var(--txt);border:2px solid var(--card2);font:16px Kanit;width:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .btn{width:auto;display:inline-block;padding:10px 14px;font-size:15px;margin:0}.sm{padding:4px 8px!important;font-size:13px!important;box-shadow:none!important}.uc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.uc .card{margin:0}.uc h3{margin:0 0 6px}.uc .nm{font-size:22px;font-weight:600}.utop{border:2px solid var(--lime)}.ulow{border:2px solid var(--bad)}.bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars div{flex:1;background:var(--or);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}.def{font-size:13px;color:var(--mut);border-left:3px solid var(--gold);padding-left:8px}</style></head>
